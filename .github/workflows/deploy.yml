name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download missing fish images
        run: |
          UA="OhioRiverFishingPWA/1.0 (https://github.com/TheDuder29/OhioRiverFishingPWA)"
          IMG="OhioRiverFishingPWA/wwwroot/images"

          # Walleye - try full file then accepted thumbnail sizes
          for URL in \
            "https://upload.wikimedia.org/wikipedia/commons/9/96/Sander_vitreus.jpg" \
            "https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Sander_vitreus.jpg/1200px-Sander_vitreus.jpg" \
            "https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Sander_vitreus.jpg/640px-Sander_vitreus.jpg"; do
            HTTP=$(curl -s -o "$IMG/walleye.jpg" -w "%{http_code}" -A "$UA" "$URL")
            if [ "$HTTP" = "200" ] && [ $(wc -c < "$IMG/walleye.jpg") -gt 10000 ]; then
              echo "Walleye OK ($HTTP): $URL"; break
            else
              echo "Walleye FAIL ($HTTP): $URL"
            fi
          done

          # Flathead Catfish - try full file then accepted thumbnail sizes
          for URL in \
            "https://upload.wikimedia.org/wikipedia/commons/8/84/Pylodictis_olivaris.jpg" \
            "https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/Pylodictis_olivaris.jpg/1200px-Pylodictis_olivaris.jpg" \
            "https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/Pylodictis_olivaris.jpg/640px-Pylodictis_olivaris.jpg"; do
            HTTP=$(curl -s -o "$IMG/flathead-catfish.jpg" -w "%{http_code}" -A "$UA" "$URL")
            if [ "$HTTP" = "200" ] && [ $(wc -c < "$IMG/flathead-catfish.jpg") -gt 10000 ]; then
              echo "Flathead OK ($HTTP): $URL"; break
            else
              echo "Flathead FAIL ($HTTP): $URL"
            fi
          done

          ls -lh "$IMG/"*.jpg

      - name: Restore dependencies
        run: dotnet restore OhioRiverFishingPWA/OhioRiverFishingPWA.csproj

      - name: Publish
        run: dotnet publish OhioRiverFishingPWA/OhioRiverFishingPWA.csproj -c Release -o publish --nologo

      - name: Fix base href for GitHub Pages
        run: |
          python3 -c "
          import re, pathlib
          f = pathlib.Path('publish/wwwroot/index.html')
          html = f.read_text()
          html = re.sub(r'<base\s+href=[\"\']/[\"\']\s*/>', '<base href=\"/OhioRiverFishingPWA/\" />', html)
          f.write_text(html)
          print('base href set to /OhioRiverFishingPWA/')
          print(html[html.find('<base'):html.find('<base')+60])
          "

      - name: Add 404.html for SPA routing
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
