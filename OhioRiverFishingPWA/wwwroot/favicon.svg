<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark river background -->
  <rect width="512" height="512" rx="80" fill="#0c2d6b"/>

  <!-- Water waves -->
  <path d="M0 360 Q128 330 256 360 Q384 390 512 360 L512 512 L0 512 Z" fill="#0288d1" opacity="0.5"/>
  <path d="M0 400 Q128 375 256 400 Q384 425 512 400 L512 512 L0 512 Z" fill="#1565c0" opacity="0.6"/>

  <!-- Fish body -->
  <ellipse cx="240" cy="230" rx="130" ry="70" fill="#4fc3f7"/>

  <!-- Fish tail -->
  <polygon points="110,230 60,175 60,285" fill="#4fc3f7"/>
  <polygon points="110,230 75,190 85,230 75,270" fill="#0288d1" opacity="0.5"/>

  <!-- Fish belly sheen -->
  <ellipse cx="250" cy="245" rx="100" ry="40" fill="white" opacity="0.15"/>

  <!-- Dorsal fin -->
  <path d="M180,162 Q220,120 280,155 L280,165 Q240,135 180,172 Z" fill="#29b6f6"/>

  <!-- Eye -->
  <circle cx="340" cy="215" r="22" fill="white"/>
  <circle cx="344" cy="215" r="14" fill="#1a237e"/>
  <circle cx="344" cy="215" r="7" fill="#0d0d0d"/>
  <circle cx="348" cy="210" r="4" fill="white"/>

  <!-- Mouth -->
  <path d="M375,235 Q390,248 375,258" stroke="#0c2d6b" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Scales detail -->
  <path d="M200,210 Q215,198 230,210" stroke="#0288d1" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M230,210 Q245,198 260,210" stroke="#0288d1" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M260,210 Q275,198 290,210" stroke="#0288d1" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M215,235 Q230,223 245,235" stroke="#0288d1" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M245,235 Q260,223 275,235" stroke="#0288d1" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M275,235 Q290,223 305,235" stroke="#0288d1" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- Fishing line from top -->
  <line x1="420" y1="0" x2="380" y2="160" stroke="white" stroke-width="3" opacity="0.7"/>
  <!-- Hook -->
  <path d="M380,160 Q400,170 400,190 Q400,215 378,220" stroke="white" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9"/>
  <line x1="378" y1="220" x2="365" y2="218" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
</svg>
