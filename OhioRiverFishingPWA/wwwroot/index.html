<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wheelersburg River & Fishing Monitor</title>
    <base href="/" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
</head>
<body>
    <div id="app">Loading...</div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                // Unregister any stale service workers first, then register fresh
                navigator.serviceWorker.getRegistrations().then(function (registrations) {
                    var unregisterAll = registrations.map(function (r) { return r.unregister(); });
                    return Promise.all(unregisterAll);
                }).then(function () {
                    return navigator.serviceWorker.register('service-worker.js');
                });
            });
        }
    </script>
</body>
</html>
