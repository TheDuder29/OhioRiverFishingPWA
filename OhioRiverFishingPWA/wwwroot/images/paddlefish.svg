<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#1a2a4a"/><stop offset="100%" style="stop-color:#2a3a5a"/></linearGradient></defs>
  <rect width="640" height="300" fill="url(#bg)"/>
  <!-- paddle/rostrum -->
  <polygon points="60,148 200,138 200,162" fill="#6a7a8a"/>
  <!-- body -->
  <ellipse cx="320" cy="152" rx="145" ry="52" fill="#7a8a9a"/>
  <!-- heterocercal tail (upper lobe longer) -->
  <polygon points="465,152 530,90 520,152" fill="#6a7a8a"/>
  <polygon points="465,152 520,195 510,152" fill="#6a7a8a"/>
  <!-- smooth skin - no scales -->
  <ellipse cx="318" cy="180" rx="130" ry="18" fill="#9aaaba" opacity="0.3"/>
  <!-- eye (small, near head-body junction) -->
  <circle cx="205" cy="148" r="6" fill="#d0d8e0"/><circle cx="206" cy="148" r="3.5" fill="#0a0a18"/><circle cx="207" cy="147" r="1.5" fill="white"/>
  <!-- dorsal fin -->
  <polygon points="290,100 325,65 380,100" fill="#6a7a8a"/>
  <rect x="0" y="240" width="640" height="60" fill="rgba(0,0,0,0.45)"/>
  <text x="320" y="268" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Paddlefish</text>
  <text x="320" y="290" font-family="Arial,sans-serif" font-size="13" fill="#b0bec5" text-anchor="middle">Polyodon spathula — Ohio River</text>
</svg>