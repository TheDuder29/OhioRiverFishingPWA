<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b5e20"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#388e3c;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#1b5e20;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" fill="url(#bg)"/>
  <ellipse cx="320" cy="280" rx="300" ry="40" fill="url(#water)"/>
  <!-- Body -->
  <ellipse cx="300" cy="150" rx="148" ry="65" fill="#8d6e3a"/>
  <!-- Tail -->
  <polygon points="448,150 510,105 510,195" fill="#7a5c2e"/>
  <!-- Head -->
  <ellipse cx="162" cy="153" rx="52" ry="50" fill="#9a7840"/>
  <!-- Dorsal fin spines -->
  <polygon points="200,85 240,45 310,85" fill="#7a5c2e"/>
  <polygon points="310,85 360,58 390,85" fill="#8d6e3a"/>
  <!-- Stripes -->
  <line x1="230" y1="102" x2="230" y2="198" stroke="#6b4f28" stroke-width="5" opacity="0.5"/>
  <line x1="270" y1="95" x2="270" y2="205" stroke="#6b4f28" stroke-width="5" opacity="0.5"/>
  <line x1="310" y1="92" x2="310" y2="208" stroke="#6b4f28" stroke-width="5" opacity="0.5"/>
  <line x1="350" y1="96" x2="350" y2="204" stroke="#6b4f28" stroke-width="5" opacity="0.5"/>
  <!-- Pectoral fin -->
  <polygon points="205,175 180,220 255,215" fill="#7a5c2e"/>
  <!-- Belly -->
  <ellipse cx="290" cy="190" rx="120" ry="20" fill="#c9a96e" opacity="0.4"/>
  <!-- Eye -->
  <circle cx="172" cy="142" r="11" fill="#e8c56a"/>
  <circle cx="174" cy="142" r="7" fill="#1a1a0e"/>
  <circle cx="176" cy="140" r="2.5" fill="white"/>
  <!-- Mouth -->
  <path d="M 125,158 Q 140,168 155,158" stroke="#5a3e1e" stroke-width="3" fill="none"/>
  <!-- Label -->
  <rect x="0" y="240" width="640" height="60" fill="rgba(0,0,0,0.45)"/>
  <text x="320" y="268" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Smallmouth Bass</text>
  <text x="320" y="290" font-family="Arial,sans-serif" font-size="13" fill="#a5d6a7" text-anchor="middle">Micropterus dolomieu — Ohio River</text>
</svg>