<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#1a2a1a"/><stop offset="100%" style="stop-color:#2a3a2a"/></linearGradient></defs>
  <rect width="640" height="300" fill="url(#bg)"/>
  <!-- elongated body -->
  <rect x="90" y="135" width="460" height="30" rx="15" fill="#7a8a5a"/>
  <!-- long snout -->
  <rect x="20" y="143" width="100" height="14" rx="7" fill="#8a9a6a"/>
  <!-- tail -->
  <polygon points="550,150 610,125 610,175" fill="#6a7a4a"/>
  <!-- bony diamond scales pattern -->
  <line x1="180" y1="135" x2="180" y2="165" stroke="#5a6a3a" stroke-width="2" opacity="0.5"/>
  <line x1="230" y1="135" x2="230" y2="165" stroke="#5a6a3a" stroke-width="2" opacity="0.5"/>
  <line x1="280" y1="135" x2="280" y2="165" stroke="#5a6a3a" stroke-width="2" opacity="0.5"/>
  <line x1="330" y1="135" x2="330" y2="165" stroke="#5a6a3a" stroke-width="2" opacity="0.5"/>
  <line x1="380" y1="135" x2="380" y2="165" stroke="#5a6a3a" stroke-width="2" opacity="0.5"/>
  <line x1="430" y1="135" x2="430" y2="165" stroke="#5a6a3a" stroke-width="2" opacity="0.5"/>
  <line x1="480" y1="135" x2="480" y2="165" stroke="#5a6a3a" stroke-width="2" opacity="0.5"/>
  <!-- dorsal fin near tail -->
  <polygon points="480,135 498,108 525,135" fill="#6a7a4a"/>
  <!-- spots along side -->
  <circle cx="210" cy="150" r="4" fill="#4a5a2a" opacity="0.6"/>
  <circle cx="265" cy="148" r="4" fill="#4a5a2a" opacity="0.6"/>
  <circle cx="320" cy="150" r="4" fill="#4a5a2a" opacity="0.6"/>
  <circle cx="375" cy="148" r="4" fill="#4a5a2a" opacity="0.6"/>
  <circle cx="430" cy="150" r="4" fill="#4a5a2a" opacity="0.6"/>
  <!-- eye -->
  <circle cx="105" cy="147" r="6" fill="#e0d890"/><circle cx="106" cy="147" r="3.5" fill="#0a0800"/><circle cx="107" cy="146" r="1.5" fill="white"/>
  <rect x="0" y="240" width="640" height="60" fill="rgba(0,0,0,0.45)"/>
  <text x="320" y="268" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Longnose Gar</text>
  <text x="320" y="290" font-family="Arial,sans-serif" font-size="13" fill="#a5d6a7" text-anchor="middle">Lepisosteus osseus — Ohio River</text>
</svg>